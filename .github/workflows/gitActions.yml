name: FinalSurge CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y allure

      - name: Run tests
        run: mvn clean test
        continue-on-error: true

      - name: Check allure-results directory
        if: always()
        run: |
          echo "Checking target/allure-results..."
          ls -la target/allure-results/ || echo "Directory not found or empty"

      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p allure-report
          if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results)" ]; then
            allure generate target/allure-results --clean -o allure-report
          else
            echo "No allure-results found, creating empty report"
            echo "No tests results" > allure-report/index.html
          fi

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gp-pagesnew
          publish_dir: allure-report
          force_orphan: false
          keep_files: true